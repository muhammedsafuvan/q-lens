name: QLens Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Format and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qlens_test
          POSTGRES_USER: qlens
          POSTGRES_PASSWORD: qlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qlens -d qlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load test environment
        run: cat .env.test.example >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install DBmate
        run: |
          curl -fsSL \
            https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64 \
            -o /usr/local/bin/dbmate
          chmod +x /usr/local/bin/dbmate
          dbmate --version

      - name: Apply database migrations
        run: |
          dbmate \
            --url "$DBMATE_DATABASE_URL" \
            --migrations-dir db/migrations \
            --no-dump-schema \
            up

      - name: Bootstrap development workspace
        run: uv run python scripts/bootstrap_dev_workspace.py > /dev/null

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v