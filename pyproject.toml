[project]
name = "qlens"
version = "0.1.0"
description = "QueueLens backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "packaging>=26.3",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "queuelens[celery]==0.1.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"